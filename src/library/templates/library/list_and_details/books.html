{% extends "library/base_generic.html" %}
{% load i18n %}

{% load custom_tags %}
{% block content %}
    {% if book_list %}
        <div class="grid">
            {% for book in book_list %}
                <div class="cell">
                    {% include 'library/partials/book-card.html' %}
                </div>  
            {% endfor %}
        </div>
    {% else %}
        <p>{% translate "No books are available." %}</p>
    {% endif %}

{% endblock %}
